name: Build Linux ELF and create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Increment patch version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Increment workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$({
            awk '
              /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^version = "/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/"$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          })"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Workspace version is not a plain semantic version: $current_version" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          head_message="$(git log -1 --pretty=%s)"
          if [[ "$head_message" == "chore(release): v$current_version" ]]; then
            next_version="$current_version"
          else
            next_version="${major}.${minor}.$((10#$patch + 1))"

            CURRENT_VERSION="$current_version" NEXT_VERSION="$next_version" perl -0pi -e '
              s/^version = "\Q$ENV{CURRENT_VERSION}\E"$/version = "$ENV{NEXT_VERSION}"/m
            ' Cargo.toml
            NEXT_VERSION="$next_version" perl -0pi -e '
              s{(<key>CFBundleShortVersionString</key>\s*<string>)[^<]+(</string>)}{$1$ENV{NEXT_VERSION}$2};
              s{(<key>CFBundleVersion</key>\s*<string>)[^<]+(</string>)}{$1$ENV{NEXT_VERSION}$2};
            ' packaging/macos/Info.plist

            cargo update --workspace

            grep -Fqx "version = \"$next_version\"" Cargo.toml
            grep -Fq "<string>$next_version</string>" packaging/macos/Info.plist

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock packaging/macos/Info.plist
            git commit -m "chore(release): v$next_version"
            git push origin HEAD:main
          fi

          release_sha="$(git rev-parse HEAD)"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux x86-64 ELF
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgl1-mesa-dev libx11-dev libxi-dev

      - name: Build Linux ELF
        run: cargo build --locked --release --package simtower-desktop --no-default-features

      - name: Prepare Linux ELF and checksum
        shell: bash
        run: |
          set -euo pipefail
          binary="OpenTower-linux-x86_64"
          mkdir -p dist
          install -m 755 target/release/simtower "dist/$binary"
          file "dist/$binary" | grep -Eq 'ELF 64-bit'
          (
            cd dist
            sha256sum "$binary" > "$binary.sha256"
            sha256sum --check "$binary.sha256"
          )

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release and trigger platform builds
    needs:
      - version
      - linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download Linux assets
        uses: actions/download-artifact@v8
        with:
          name: linux-release-assets
          path: dist

      - name: Verify Linux assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          (
            cd dist
            sha256sum --check OpenTower-linux-x86_64.sha256
          )

      - name: Create release tag
        env:
          RELEASE_SHA: ${{ needs.version.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "$RELEASE_TAG already points to $tagged_sha, not $RELEASE_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "OpenTower $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: OpenTower v${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_NAME" \
              --verify-tag \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Trigger Windows and macOS release builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.version.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg release_sha "$RELEASE_SHA" \
            '{
              event_type: "opentower-release",
              client_payload: {
                tag: $tag,
                version: $version,
                release_sha: $release_sha
              }
            }' | gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/dispatches" \
              --input -
