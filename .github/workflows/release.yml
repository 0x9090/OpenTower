name: Release main branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Increment patch version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Increment workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$({
            awk '
              /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^version = "/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/"$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          })"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Workspace version is not a plain semantic version: $current_version" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          head_message="$(git log -1 --pretty=%s)"
          if [[ "$head_message" == "chore(release): v$current_version" ]]; then
            next_version="$current_version"
          else
            next_version="${major}.${minor}.$((10#$patch + 1))"

            CURRENT_VERSION="$current_version" NEXT_VERSION="$next_version" perl -0pi -e '
              s/^version = "\Q$ENV{CURRENT_VERSION}\E"$/version = "$ENV{NEXT_VERSION}"/m
            ' Cargo.toml
            NEXT_VERSION="$next_version" perl -0pi -e '
              s{(<key>CFBundleShortVersionString</key>\s*<string>)[^<]+(</string>)}{$1$ENV{NEXT_VERSION}$2};
              s{(<key>CFBundleVersion</key>\s*<string>)[^<]+(</string>)}{$1$ENV{NEXT_VERSION}$2};
            ' packaging/macos/Info.plist

            cargo update --workspace

            grep -Fqx "version = \"$next_version\"" Cargo.toml
            grep -Fq "<string>$next_version</string>" packaging/macos/Info.plist

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock packaging/macos/Info.plist
            git commit -m "chore(release): v$next_version"
            git push origin HEAD:main
          fi

          release_sha="$(git rev-parse HEAD)"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgl1-mesa-dev libx11-dev libxi-dev

      - name: Build OpenTower
        if: runner.os != 'macOS'
        run: cargo build --locked --release --package simtower-desktop --no-default-features

      - name: Build universal macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --package simtower-desktop --no-default-features \
            --target aarch64-apple-darwin
          cargo build --locked --release --package simtower-desktop --no-default-features \
            --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/simtower \
            target/x86_64-apple-darwin/release/simtower \
            -output target/release/simtower-universal
          chmod +x target/release/simtower-universal
          lipo -info target/release/simtower-universal

      - name: Package Linux binary and checksum
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="OpenTower-linux-x86_64"
          mkdir -p "packages/${package}"
          install -m 755 target/release/simtower "packages/${package}/OpenTower"
          tar -C packages -czf "packages/${package}.tar.gz" "${package}"
          rm -rf "packages/${package}"
          (
            cd packages
            sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
          )

      - name: Package macOS application and checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          package="OpenTower-macos-universal"
          mkdir -p "packages/${package}"
          scripts/create-macos-app.sh \
            target/release/simtower-universal \
            "packages/${package}/OpenTower.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "packages/${package}" \
            "packages/${package}.zip"
          rm -rf "packages/${package}"
          (
            cd packages
            shasum -a 256 "${package}.zip" > "${package}.zip.sha256"
          )

      - name: Package Windows binary and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'OpenTower-windows-x86_64'
          New-Item -ItemType Directory -Force -Path "packages/$package" | Out-Null
          Copy-Item 'target/release/simtower.exe' "packages/$package/OpenTower.exe"
          Compress-Archive -Path "packages/$package" -DestinationPath "packages/$package.zip"
          Remove-Item -Recurse -Force "packages/$package"
          $archive = "$package.zip"
          $hash = (Get-FileHash "packages/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "packages/$archive.sha256",
            "$hash  $archive`n",
            [Text.Encoding]::ASCII
          )

      - name: Upload packaged binary and checksum
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            OpenTower-linux-x86_64.tar.gz
            OpenTower-macos-universal.zip
            OpenTower-windows-x86_64.zip
          )
          for package in "${expected[@]}"; do
            test -f "dist/$package"
            test -f "dist/$package.sha256"
            (
              cd dist
              sha256sum --check "$package.sha256"
            )
          done
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6

      - name: Create release tag
        env:
          RELEASE_SHA: ${{ needs.version.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "$RELEASE_TAG already points to $tagged_sha, not $RELEASE_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "OpenTower $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: OpenTower v${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_NAME" \
              --verify-tag \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
