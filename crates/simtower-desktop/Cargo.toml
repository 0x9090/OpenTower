[package]
name = "simtower-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "simtower"
path = "src/main.rs"

[features]
default = ["bundled-resources"]
# Development builds retain the extracted local assets. Public release builds
# disable this feature and load them from the player's original SimTower.exe.
bundled-resources = []

[dependencies]
macroquad = "0.4.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simtower-core = { path = "../simtower-core" }
simtower-formats = { path = "../simtower-formats" }

[target.'cfg(target_os = "macos")'.dependencies]
objc-rs = "0.2.8"
